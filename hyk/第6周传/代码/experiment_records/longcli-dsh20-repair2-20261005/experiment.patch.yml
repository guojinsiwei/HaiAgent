- id: agent-default-model
  config:
    provider: longcli-deepseek
    model: deepseek-flash
    reasoningEffort: off
- id: llm-pi-ai
  config:
    providers:
      longcli-deepseek:
        apiKeyEnv: LONGCLI_PROXY_TOKEN
        api: openai-completions
        baseURL: !!js process.env.LONGCLI_PROXY_URL
        defaultMaxTokens: 32768
        reasoning: off
        compat:
          thinkingFormat: deepseek
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        retryPolicy:
          mode: normal
          maxRetries: 1
        models:
          - id: deepseek-flash
            contextWindow: 1000000
            maxTokens: 32768
            input: [text]
            reasoningEfforts:
              off:
              high: high
- id: session-log-deepseek
  config:
    enabled: false
- id: bash-sandbox
  config:
    timeoutMs: 300000
- insert:
    - id: longcli-experiment-budget
      name: /opt/experiment/budget.mjs

- id: compaction-basic
  config:
    headroomTokens: 65536
    maxTokens: 2048
