- id: llm-deepseek
  config:
    apiKeyEnv: TAOTOKEN_API_KEY
    baseURL: https://api.taotoken.net/token
    thinking: disabled
    reasoningEffort: off
    maxTokens: 32768
    defaultContextWindow: 1000000
    models:
      - id: deepseek-flash
        name: TaoToken Token Plan / deepseek-flash
        contextWindow: 1000000
        maxTokens: 32768
        inputModalities: [text]
- id: llm-deepseek-account
  disabled: true
- id: session-title-llm
  disabled: true
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash
- insert:
    - id: paired-budget
      name: /opt/kz/shared-budget.mjs
