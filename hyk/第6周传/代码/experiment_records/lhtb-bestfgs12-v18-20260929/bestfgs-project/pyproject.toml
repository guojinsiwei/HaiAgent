[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "best-fgs"
version = "0.18.0"
description = "Continuous CLI execution with on-demand exploration advice and restorable attempts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cli-retrac-best-fgs = "bestfgs.lean_cli:main"
best-fgs = "bestfgs.lean_cli:main"
best-fgs-legacy = "bestfgs.__main__:main"
raw-cli-baseline = "bestfgs.raw_baseline:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
