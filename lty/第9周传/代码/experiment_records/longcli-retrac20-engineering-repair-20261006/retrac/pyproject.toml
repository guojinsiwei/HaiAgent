[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrac-longcli"
version = "0.1.0"
description = "Paper-grounded RE-TRAC inference and LongCLI-Bench agent adapter"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pydantic>=2.10.5"]

[project.scripts]
retrac = "retrac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
