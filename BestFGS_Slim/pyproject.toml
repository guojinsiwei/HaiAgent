[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "best-fgs-slim"
version = "0.1.0"
description = "Phase-adaptive semantic best-first graph search for budgeted CLI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
best-fgs-slim = "cli_retrac_mcts.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
